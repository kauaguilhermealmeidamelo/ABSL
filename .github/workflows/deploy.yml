name: Deploy para HostGator (SSH)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout do código
        uses: actions/checkout@v4

      # ============================================================
      # PHP / LARAVEL
      # ============================================================

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      # ============================================================
      # NODE / VUE
      # ============================================================

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do npm
        working-directory: frontend
        run: npm ci

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

      # ============================================================
      # COPIAR BUILD DO VUE PARA O LARAVEL
      # ============================================================

      - name: Copiar frontend/dist para backend/public
        run: |
          rsync -a \
            --exclude='storage/' \
            --exclude='.htaccess' \
            --exclude='robots.txt' \
            frontend/dist/ backend/public/

      # ============================================================
      # CONFIGURAR SSH
      # ============================================================

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      # ============================================================
      # ENVIAR BACKEND PARA O SERVIDOR
      # ============================================================

      - name: Enviar backend via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/

      # ============================================================
      # ENVIAR ASSETS DO VITE PARA PUBLIC_HTML
      # ============================================================

      - name: Enviar assets estáticos para public_html
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa" \
            backend/public/assets/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:public_html/assets/

      # ============================================================
      # ENVIAR ARQUIVOS ESTÁTICOS DA RAIZ DO FRONTEND
      # ============================================================

      - name: Enviar arquivos estáticos para public_html
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa" \
            --exclude='index.php' \
            --exclude='.htaccess' \
            --exclude='assets/' \
            --exclude='storage/' \
            backend/public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:public_html/

      # ============================================================
      # PÓS-DEPLOY NO SERVIDOR
      # ============================================================

      - name: Executar comandos pós-deploy
        run: |
          ssh \
            -p "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "
              set -e

              cd '${{ secrets.REMOTE_PATH }}'

              echo '=== Composer ==='

              /opt/cpanel/ea-php84/root/usr/bin/php \
                /opt/cpanel/composer/bin/composer \
                install \
                --no-dev \
                --optimize-autoloader \
                --no-interaction

              echo '=== Storage link ==='

              /opt/cpanel/ea-php84/root/usr/bin/php \
                artisan storage:link || true

              echo '=== Migrations ==='

              /opt/cpanel/ea-php84/root/usr/bin/php \
                artisan migrate --force

              echo '=== Limpando cache ==='

              /opt/cpanel/ea-php84/root/usr/bin/php \
                artisan optimize:clear

              echo '=== Criando cache de configuração ==='

              /opt/cpanel/ea-php84/root/usr/bin/php \
                artisan config:cache

              echo '=== Criando cache de rotas ==='

              /opt/cpanel/ea-php84/root/usr/bin/php \
                artisan route:cache

              echo '=== Criando cache de views ==='

              /opt/cpanel/ea-php84/root/usr/bin/php \
                artisan view:cache

              echo '=== DEPLOY CONCLUÍDO ==='
            "
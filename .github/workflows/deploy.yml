name: Deploy para HostGator (SSH)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout do código
        uses: actions/checkout@v4

      # ============================================================
      # PHP / LARAVEL
      # ============================================================

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      # ============================================================
      # NODE / VUE
      # ============================================================

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

      # ============================================================
      # COPIAR BUILD DO VUE PARA O LARAVEL
      # ============================================================

      - name: Copiar frontend/dist para backend/public
        run: |
          rsync -av \
            frontend/dist/ \
            backend/public/

      # ============================================================
      # CONFIGURAR SSH
      # ============================================================

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      # ============================================================
      # ENVIAR BACKEND PARA /absl
      # ============================================================

      - name: Enviar backend via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/

      # ============================================================
      # ENVIAR FRONTEND PARA /public_html
      #
      # index.php e .htaccess existentes no public_html são
      # preservados porque pertencem à configuração do HostGator.
      # ============================================================

      - name: Enviar arquivos públicos para public_html
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa" \
            --exclude='index.php' \
            --exclude='.htaccess' \
            --exclude='storage/' \
            backend/public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:public_html/

      # ============================================================
      # PÓS-DEPLOY NO SERVIDOR
      # ============================================================

      - name: Executar comandos pós-deploy
        run: |
          ssh \
            -p "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "
              set -e

              cd '${{ secrets.REMOTE_PATH }}'

              PHP=/opt/cpanel/ea-php84/root/usr/bin/php

              echo '======================================'
              echo 'PHP'
              echo '======================================'

              \$PHP -v

              echo '======================================'
              echo 'LOCALIZANDO COMPOSER'
              echo '======================================'

              if command -v composer >/dev/null 2>&1; then
                COMPOSER=\$(command -v composer)
              elif [ -x /opt/cpanel/composer/bin/composer ]; then
                COMPOSER=/opt/cpanel/composer/bin/composer
              elif [ -x /usr/local/bin/composer ]; then
                COMPOSER=/usr/local/bin/composer
              else
                echo 'ERRO: Composer não encontrado no servidor.'
                exit 1
              fi

              echo \"Composer encontrado em: \$COMPOSER\"

              echo '======================================'
              echo 'COMPOSER INSTALL'
              echo '======================================'

              \$PHP \$COMPOSER install \
                --no-dev \
                --optimize-autoloader \
                --no-interaction

              echo '======================================'
              echo 'STORAGE LINK'
              echo '======================================'

              \$PHP artisan storage:link || true

              echo '======================================'
              echo 'MIGRATIONS'
              echo '======================================'

              \$PHP artisan migrate --force

              echo '======================================'
              echo 'LIMPANDO CACHE'
              echo '======================================'

              \$PHP artisan optimize:clear

              echo '======================================'
              echo 'CACHE DE CONFIGURAÇÃO'
              echo '======================================'

              \$PHP artisan config:cache

              echo '======================================'
              echo 'CACHE DE ROTAS'
              echo '======================================'

              \$PHP artisan route:cache

              echo '======================================'
              echo 'CACHE DE VIEWS'
              echo '======================================'

              \$PHP artisan view:cache

              echo '======================================'
              echo 'DEPLOY CONCLUÍDO COM SUCESSO'
              echo '======================================'
            "
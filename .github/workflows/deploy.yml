#!/usr/bin/env bash
#
# scripts/deploy.sh
#
# Publica o projeto em produção. Só funciona a partir da branch "main" e
# com a árvore de trabalho limpa — isso impede publicar acidentalmente
# alterações que ainda estão sendo testadas em "dev".
#
# IMPORTANTE: "storage/app" (uploads de notícias, gabaritos, transparência,
# mídia da tela inicial etc.) é ignorado pelo git de propósito — esses
# arquivos só existem no servidor. Por isso este script NUNCA sincroniza
# nem apaga "storage/app" no servidor remoto, mesmo usando rsync --delete
# no restante da pasta backend/. Enviar essa pasta a partir da máquina
# local (onde ela está vazia) apagaria os arquivos reais de produção.
#
# Uso local (só gera o build em backend/public):
#   ./scripts/deploy.sh
#
# Uso com envio automático via rsync/ssh, definindo variáveis de ambiente:
#   DEPLOY_SSH_HOST=SEU_SERVIDOR \
#   DEPLOY_SSH_USER=SEU_USUARIO \
#   DEPLOY_SSH_PORT=2222 \
#   DEPLOY_REMOTE_PATH=/caminho/no/servidor \
#   ./scripts/deploy.sh

set -euo pipefail

RAIZ="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
cd "$RAIZ"

BRANCH_ATUAL="$(git rev-parse --abbrev-ref HEAD)"

if [ "$BRANCH_ATUAL" != "main" ]; then
  echo "❌ Deploy bloqueado: você está na branch '$BRANCH_ATUAL', não em 'main'."
  echo "   Finalize e mescle suas alterações em 'main' antes de publicar:"
  echo ""
  echo "     git checkout main && git merge dev"
  echo ""
  exit 1
fi

if [ -n "$(git status --porcelain)" ]; then
  echo "❌ Deploy bloqueado: existem alterações não commitadas em 'main'."
  echo ""
  git status --short
  echo ""
  echo "   Commite ou descarte essas alterações antes de publicar."
  exit 1
fi

echo "✅ Branch 'main' limpa. Buildando o frontend..."
cd "$RAIZ/frontend"
npm ci
npm run build
cd "$RAIZ"

echo "✅ Copiando build para backend/public..."
# Preserva o link simbólico storage/ (aponta para storage/app/public) e
# outros arquivos que não vêm do build do Vue.
rsync -a --delete \
  --exclude='storage' \
  --exclude='.htaccess' \
  --exclude='robots.txt' \
  frontend/dist/ backend/public/

echo "✅ Build copiado para backend/public."

if [ -n "${DEPLOY_SSH_HOST:-}" ] && [ -n "${DEPLOY_SSH_USER:-}" ] && [ -n "${DEPLOY_REMOTE_PATH:-}" ]; then
  PORTA="${DEPLOY_SSH_PORT:-22}"
  echo "🚀 Enviando backend/ para ${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:${DEPLOY_REMOTE_PATH} (porta ${PORTA})..."

  # ATENÇÃO: --exclude aqui protege pastas que só devem existir no
  # servidor. 'storage/app' NUNCA é excluído por acidente — é sempre
  # ignorado, mesmo que alguém remova essa linha achando redundante.
  rsync -avz --delete \
    -e "ssh -p ${PORTA}" \
    --exclude='.env' \
    --exclude='storage/app' \
    --exclude='storage/framework' \
    --exclude='storage/logs' \
    --exclude='node_modules' \
    --exclude='vendor' \
    backend/ "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:${DEPLOY_REMOTE_PATH}"

  echo "✅ Arquivos enviados. Rode no servidor, se necessário:"
  echo "     composer install --no-dev --optimize-autoloader"
  echo "     php artisan migrate --force"
  echo "     php artisan storage:link   # recria o link se não existir"
  echo "     php artisan config:cache && php artisan route:cache"
else
  echo "ℹ️  Envio remoto não configurado (defina DEPLOY_SSH_HOST, DEPLOY_SSH_USER,"
  echo "    DEPLOY_REMOTE_PATH e opcionalmente DEPLOY_SSH_PORT para enviar via rsync/ssh)."
  echo "    Por enquanto, envie backend/ para o servidor manualmente,"
  echo "    tomando cuidado para NÃO sobrescrever storage/app no servidor."
fi

echo "🎉 Deploy finalizado."
